name: Deploy Infra - Video Upload (Banco no RDS Compartilhado)

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  K8S_NAMESPACE: raceforce-dev
  DB_NAME: video_upload_db
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'fiap-14soat-fase4-jonasfschuh' }}

jobs:
  create-database:
    name: Criar banco de dados no RDS compartilhado
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y jq postgresql-client

      - name: Ler endpoint RDS e EKS do tfstate da infra
        run: |
          set -euo pipefail
          INFRA_STATE=$(aws s3 cp "s3://${{ env.TF_STATE_BUCKET }}/infra/terraform.tfstate" -)

          RDS_HOST=$(echo "$INFRA_STATE" | jq -r '.outputs.rds_host.value // empty')
          RDS_PORT=$(echo "$INFRA_STATE" | jq -r '.outputs.rds_port.value // "5432"')
          EKS_CLUSTER_NAME=$(echo "$INFRA_STATE" | jq -r '.outputs.eks_cluster_name.value // empty')

          if [ -z "$RDS_HOST" ] || [ "$RDS_HOST" = "null" ]; then
            echo "Erro: output rds_host nao encontrado. Execute o deploy do iac-terraform primeiro."
            exit 1
          fi

          echo "RDS_HOST=${RDS_HOST}" >> "$GITHUB_ENV"
          echo "RDS_PORT=${RDS_PORT}" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER_NAME=${EKS_CLUSTER_NAME}" >> "$GITHUB_ENV"
          echo "RDS endpoint: ${RDS_HOST}:${RDS_PORT}"

      - name: Criar banco de dados se nao existir
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Verificando banco '${{ env.DB_NAME }}' em ${RDS_HOST}:${RDS_PORT}..."
          DB_EXISTS=$(psql -h "${RDS_HOST}" -p "${RDS_PORT}" -U postgres -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname = '${{ env.DB_NAME }}'")
          if [ "${DB_EXISTS}" = "1" ]; then
            echo "Banco '${{ env.DB_NAME }}' ja existe. Nenhuma acao necessaria."
          else
            echo "Criando banco '${{ env.DB_NAME }}'..."
            psql -h "${RDS_HOST}" -p "${RDS_PORT}" -U postgres -d postgres \
              -c "CREATE DATABASE \"${{ env.DB_NAME }}\""
            echo "Banco '${{ env.DB_NAME }}' criado com sucesso."
          fi

      - name: Garantir acesso EKS
        run: |
          CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$CALLER_ARN" == *:assumed-role/* ]]; then
            ROLE_NAME="${CALLER_ARN#*:assumed-role/}"; ROLE_NAME="${ROLE_NAME%%/*}"
            PRINCIPAL_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"
          else
            PRINCIPAL_ARN="$CALLER_ARN"
          fi
          aws eks create-access-entry --cluster-name "${EKS_CLUSTER_NAME}" --region "${{ env.AWS_REGION }}" --principal-arn "${PRINCIPAL_ARN}" --type STANDARD >/dev/null 2>&1 || true
          aws eks associate-access-policy --cluster-name "${EKS_CLUSTER_NAME}" --region "${{ env.AWS_REGION }}" --principal-arn "${PRINCIPAL_ARN}" --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy --access-scope type=cluster >/dev/null 2>&1 || true

      - name: Configurar kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "${EKS_CLUSTER_NAME}"

      - name: Garantir namespace
        run: kubectl get namespace ${{ env.K8S_NAMESPACE }} >/dev/null 2>&1 || kubectl create namespace ${{ env.K8S_NAMESPACE }}

      - name: Atualizar secret K8s com conexao do banco
        run: |
          JDBC_URL="jdbc:postgresql://${RDS_HOST}:${RDS_PORT}/${{ env.DB_NAME }}?sslmode=require"
          kubectl create secret generic app-secrets \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --from-literal=SPRING_DATASOURCE_URL="${JDBC_URL}" \
            --from-literal=SPRING_DATASOURCE_USERNAME="postgres" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --from-literal=AWS_SESSION_TOKEN="${{ secrets.AWS_SESSION_TOKEN }}" \
            --from-literal=AWS_REGION="us-east-1" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_KEY }}" \
            --from-literal=NEW_RELIC_APP_NAME="video-upload-ms-aws" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Secret app-secrets atualizado para ${{ env.DB_NAME }}"
