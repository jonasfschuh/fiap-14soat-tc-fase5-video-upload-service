name: Destroy Infra - Video Upload

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite DESTROY para confirmar a destruicao do banco de dados"
        required: true

env:
  AWS_REGION: us-east-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'fiap-14soat-fase4-jonasfschuh' }}

jobs:
  destroy-database:
    name: Destruir RDS PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmacao
        if: ${{ github.event.inputs.confirm != 'DESTROY' }}
        run: |
          echo "Confirmacao invalida. Digite DESTROY para confirmar."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=video-upload/database/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Destroy
        working-directory: terraform
        env:
          TF_VAR_terraform_state_bucket: ${{ env.TF_STATE_BUCKET }}
          TF_VAR_db_master_password: ${{ secrets.DB_PASSWORD }}
        run: terraform destroy -auto-approve
