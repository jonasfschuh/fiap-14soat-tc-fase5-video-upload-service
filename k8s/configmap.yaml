apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: fiapx
  labels:
    app: ms-video-upload
    environment: development
data:
  SERVER_PORT: "8083"
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_TRANSACTION_COORDINATOR_CLASS: "jdbc"
  SPRING_JPA_PROPERTIES_HIBERNATE_TRANSACTION_JTA_PLATFORM: "org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform"
  SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_LOB_NON_CONTEXTUAL_CREATION: "true"
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_FLYWAY_LOCATIONS: "classpath:db/migration"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
  SPRING_FLYWAY_OUT_OF_ORDER: "false"
  SPRING_FLYWAY_CLEAN_DISABLED: "true"
  SPRING_FLYWAY_BASELINE_VERSION: "0"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_HEALTH_DEFAULTS_ENABLED: "true"
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_BR_COM_FIAP: "DEBUG"
  LOGGING_STRUCTURED_FORMAT_CONSOLE: "logstash"
  SPRING_PROFILES_ACTIVE: "dev"
  RABBITMQ_HOST: "rabbitmq.fiapx.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "fiapx"
  STORAGE_TYPE: "local"
  STORAGE_LOCAL_PATH: "/app/videos/uploads"
  AUTH_SERVICE_URL: "http://auth-service.fiapx.svc.cluster.local:8090"
