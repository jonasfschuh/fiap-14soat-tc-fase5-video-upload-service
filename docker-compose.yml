name: ms-video-upload
services:

  # ─── Video Upload API ────────────────────────────────────────────────────
  video-upload-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-upload-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5433/video_upload_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8083
      # Storage — usa pasta local em ambiente Docker
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/uploads
      MAX_UPLOAD_SIZE: 500MB
      RABBITMQ_HOST: host.docker.internal
      RABBITMQ_PORT: 5672
      RABBITMQ_VHOST: fiapx
      RABBITMQ_USER: fiapx
      RABBITMQ_PASSWORD: fiapx123
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-api:8090}
      # New Relic — license key injetada via .env
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: video-upload-ms-local
    ports:
      - "8083:8083"
    volumes:
      - video-uploads:/app/uploads
    networks:
      - app-network
      - fiap-network
    restart: unless-stopped

  # ─── Adminer (DB UI) ─────────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: adminer-video-upload
    environment:
      ADMINER_DEFAULT_SERVER: host.docker.internal:5433
    ports:
      - "8093:8080"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
  fiap-network:
    external: true
    name: fiap-network

volumes:
  video-uploads:
