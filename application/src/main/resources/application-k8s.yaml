# Perfil K8s — springdoc configurado para funcionar atras do ingress nginx.
# O ingress reescreve /video-upload(/|$)(.*) -> /$2, entao o app recebe
# requisicoes sem o prefixo /video-upload. O browser (Swagger UI) porem
# precisa usar os paths completos para que o ingress roteia corretamente.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # Nao sobrescrever para /swagger-ui/index.html: esse e o mesmo path do
    # recurso estatico real da UI, e o controller de redirecionamento do
    # springdoc conflita com ele, causando 404. Mantem o default
    # /swagger-ui.html (herdado de application.yml) como ponto de entrada.
    config-url: /video-upload/v3/api-docs/swagger-config
    url: /video-upload/v3/api-docs
